name: Build

on:
  push:
    branches: [ main, feat/policy-maintenance-archive-external-phase ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify x64-only implementation scope
        shell: pwsh
        run: |
          $patterns = 'arm64|windows-11-arm|VC-WIN64-ARM|amd64_arm64|aa64'
          $implementationFiles = & git ls-files -- `
            src tests tools eng `
            .github/workflows/sqlcipher-native.yml `
            Directory.Build.props Directory.Packages.props Clipensk.slnx
          if ($LASTEXITCODE -ne 0) {
            throw "git ls-files failed with exit code $LASTEXITCODE."
          }

          $matches = @(
            foreach ($file in $implementationFiles) {
              Select-String -LiteralPath $file -Pattern $patterns -CaseSensitive:$false
            }
          )

          if ($matches.Count -gt 0) {
            $matches | ForEach-Object { Write-Host $_ }
            throw 'ARM64 implementation marker found. Clipensk supports Windows x64 only.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Clipensk.slnx --verbosity quiet

      - name: Build
        run: dotnet build Clipensk.slnx --configuration Release --no-restore --verbosity quiet

      - name: Test
        shell: pwsh
        run: |
          $resultsDirectory = Join-Path $env:RUNNER_TEMP 'clipensk-parallel-trx'
          $consoleLog = Join-Path $env:RUNNER_TEMP 'clipensk-parallel-test.log'
          New-Item -ItemType Directory -Force -Path $resultsDirectory | Out-Null

          & dotnet test Clipensk.slnx `
            --configuration Release `
            --no-build `
            --logger 'trx;LogFilePrefix=parallel' `
            --results-directory $resultsDirectory `
            *> $consoleLog
          $exitCode = $LASTEXITCODE

          if ($exitCode -eq 0) {
            Write-Host 'Full parallel suite passed.'
            exit 0
          }

          Write-Host '=== EXACT PARALLEL TEST FAILURE ==='
          $failedCount = 0
          foreach ($file in Get-ChildItem -Path $resultsDirectory -Filter '*.trx' -Recurse) {
            [xml]$trx = Get-Content -LiteralPath $file.FullName -Raw
            $failedResults = @($trx.SelectNodes("//*[local-name()='UnitTestResult' and @outcome='Failed']"))
            foreach ($result in $failedResults) {
              $failedCount++
              $testName = $result.GetAttribute('testName')
              $messageNode = $result.SelectSingleNode("./*[local-name()='Output']/*[local-name()='ErrorInfo']/*[local-name()='Message']")
              $stackNode = $result.SelectSingleNode("./*[local-name()='Output']/*[local-name()='ErrorInfo']/*[local-name()='StackTrace']")
              $message = if ($null -ne $messageNode) { $messageNode.InnerText.Trim() } else { '<no message>' }
              $stack = if ($null -ne $stackNode) { $stackNode.InnerText.Trim() } else { '<no stack trace>' }

              Write-Host "TRX: $($file.Name)"
              Write-Host "FAILED: $testName"
              Write-Host 'MESSAGE:'
              Write-Host $message
              Write-Host 'STACK:'
              Write-Host $stack

              $annotationMessage = ($message -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')
              Write-Host "::error title=Parallel test failure: $testName::$annotationMessage"
            }
          }

          if ($failedCount -eq 0) {
            Write-Host 'No failed UnitTestResult was present in TRX. Console tail:'
            Get-Content -LiteralPath $consoleLog -Tail 160 | ForEach-Object { Write-Host $_ }
          }

          exit $exitCode
