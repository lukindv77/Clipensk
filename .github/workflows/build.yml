name: Build

on:
  push:
    branches: [ main, feat/policy-maintenance-archive-external-phase ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize deterministic Archive lease test
        shell: pwsh
        run: |
          $path = 'tests/Clipensk.Storage.Tests/ProtectedArchiveExternalPolicyMaintenanceServiceTests.cs'
          $text = [System.IO.File]::ReadAllText($path)
          $pattern = '(?ms)^    \[Fact\]\r?\n    public async Task ApplyAsync_HoldsSharedMutationLeaseAcrossArchiveObservationAndMarkerCommit\(\)\r?\n    \{.*?^    \}\r?\n(?=\r?\n?    private static async Task<ArchiveFileName>)'
          $replacement = @'
              [Fact]
              public async Task ApplyAsync_HoldsSharedMutationLeaseAcrossArchiveObservationAndMarkerCommit()
              {
                  using GlobalPolicyTestEnvironment environment = await GlobalPolicyTestEnvironment.CreateAsync();
                  await environment.Repository.InitializeAsync(Policy(
                      ClipboardCapturePolicyRule.Allow,
                      ("PNG", ClipboardCapturePolicyRule.Allow)));
                  await CreateArchiveAsync(environment, 12, 1, 31);
                  await new ProtectedCurrentPolicyMaintenanceService(environment.Session, environment.Factory)
                      .ApplyAsync(Policy(
                          ClipboardCapturePolicyRule.Allow,
                          ("PNG", ClipboardCapturePolicyRule.Deny)));

                  Task<ProtectedStorageMutationLease>? competingAfterAcquire = null;
                  Task<ProtectedStorageMutationLease>? competingBeforeMarkerCommit = null;
                  var service = new ProtectedArchiveExternalPolicyMaintenanceService(
                      environment.Session,
                      environment.Factory,
                      checkpoint =>
                      {
                          if (checkpoint == ArchiveExternalPolicyMaintenanceCheckpoint.MutationLeaseAcquired)
                          {
                              competingAfterAcquire = environment.Session.AcquireMutationLeaseAsync().AsTask();
                              Assert.False(
                                  competingAfterAcquire.IsCompleted,
                                  "Archive maintenance must own the mutation lease before archive observation.");
                          }
                          else if (checkpoint == ArchiveExternalPolicyMaintenanceCheckpoint.BeforeMarkerCommit)
                          {
                              Assert.NotNull(competingAfterAcquire);
                              Assert.False(
                                  competingAfterAcquire.IsCompleted,
                                  "Archive maintenance must retain the mutation lease through archive observation and writes.");
                              competingBeforeMarkerCommit = environment.Session.AcquireMutationLeaseAsync().AsTask();
                              Assert.False(
                                  competingBeforeMarkerCommit.IsCompleted,
                                  "Archive maintenance must retain the mutation lease through marker commit preparation.");
                          }
                      });

                  ArchiveExternalPolicyMaintenanceResult result = await service.ApplyAsync();

                  Assert.NotNull(competingAfterAcquire);
                  Assert.NotNull(competingBeforeMarkerCommit);
                  Assert.False(result.WasAlreadyCompleted);
                  using (ProtectedStorageMutationLease acquired = await competingAfterAcquire)
                  {
                  }
                  using (ProtectedStorageMutationLease acquired = await competingBeforeMarkerCommit)
                  {
                  }
              }

          '@
          $regex = [regex]::new($pattern)
          $matches = $regex.Matches($text)
          if ($matches.Count -ne 1) {
            throw "Expected exactly one Archive lease test method, found $($matches.Count)."
          }
          $updated = $regex.Replace($text, $replacement, 1)
          [System.IO.File]::WriteAllText($path, $updated, [System.Text.UTF8Encoding]::new($false))

          if (-not (git diff --quiet -- $path)) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- $path
            git commit -m 'test: format deterministic Archive mutation lease assertion'
            git push origin HEAD:${{ github.ref_name }}
          }

      - name: Verify x64-only implementation scope
        shell: pwsh
        run: |
          $patterns = 'arm64|windows-11-arm|VC-WIN64-ARM|amd64_arm64|aa64'
          $implementationFiles = & git ls-files -- `
            src tests tools eng `
            .github/workflows/sqlcipher-native.yml `
            Directory.Build.props Directory.Packages.props Clipensk.slnx
          if ($LASTEXITCODE -ne 0) {
            throw "git ls-files failed with exit code $LASTEXITCODE."
          }

          $matches = @(
            foreach ($file in $implementationFiles) {
              Select-String -LiteralPath $file -Pattern $patterns -CaseSensitive:$false
            }
          )

          if ($matches.Count -gt 0) {
            $matches | ForEach-Object { Write-Host $_ }
            throw 'ARM64 implementation marker found. Clipensk supports Windows x64 only.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Clipensk.slnx

      - name: Build
        run: dotnet build Clipensk.slnx --configuration Release --no-restore

      - name: Test with focused failure diagnostics
        shell: pwsh
        run: |
          & dotnet test Clipensk.slnx --configuration Release --no-build --logger "trx;LogFileName=full.trx"
          $testExit = $LASTEXITCODE

          Get-ChildItem -Path . -Recurse -Filter full.trx | ForEach-Object {
            [xml]$trx = Get-Content -Raw $_.FullName
            foreach ($result in $trx.SelectNodes("//*[local-name()='UnitTestResult' and @outcome='Failed']")) {
              Write-Host "FAILED: $($result.GetAttribute('testName'))"
              $message = $result.SelectSingleNode("./*[local-name()='Output']/*[local-name()='ErrorInfo']/*[local-name()='Message']")
              $stack = $result.SelectSingleNode("./*[local-name()='Output']/*[local-name()='ErrorInfo']/*[local-name()='StackTrace']")
              if ($null -ne $message) { Write-Host "MESSAGE: $($message.InnerText)" }
              if ($null -ne $stack) { Write-Host "STACK: $($stack.InnerText)" }
            }
          }

          exit $testExit
