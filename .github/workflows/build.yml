name: Build

on:
  push:
    branches: [ main, feat/archive-split-maintenance-ui ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify x64-only implementation scope
        shell: pwsh
        run: |
          $patterns = 'arm64|windows-11-arm|VC-WIN64-ARM|amd64_arm64|aa64'
          $implementationFiles = & git ls-files -- `
            src tests tools eng `
            .github/workflows/sqlcipher-native.yml `
            Directory.Build.props Directory.Packages.props Clipensk.slnx
          if ($LASTEXITCODE -ne 0) {
            throw "git ls-files failed with exit code $LASTEXITCODE."
          }

          $matches = @(
            foreach ($file in $implementationFiles) {
              Select-String -LiteralPath $file -Pattern $patterns -CaseSensitive:$false
            }
          )

          if ($matches.Count -gt 0) {
            $matches | ForEach-Object { Write-Host $_ }
            throw 'ARM64 implementation marker found. Clipensk supports Windows x64 only.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Clipensk.slnx

      # Temporary project-level diagnostics. Step status is intentionally enough to
      # localize a failure when GitHub connector job logs are unavailable.
      - name: Diagnostic build Core
        run: dotnet build src/Clipensk.Core/Clipensk.Core.csproj --configuration Release --no-restore

      - name: Diagnostic build Storage
        run: dotnet build src/Clipensk.Storage/Clipensk.Storage.csproj --configuration Release --no-restore

      - name: Diagnostic build Infrastructure
        run: dotnet build src/Clipensk.Infrastructure/Clipensk.Infrastructure.csproj --configuration Release --no-restore

      - name: Diagnostic build Windows
        run: dotnet build src/Clipensk.Windows/Clipensk.Windows.csproj --configuration Release --no-restore

      - name: Diagnostic build App
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & dotnet build src/Clipensk.App/Clipensk.App.csproj --configuration Release --no-restore 2>&1 | Tee-Object -FilePath artifacts/app-build-output.txt
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            exit $buildExitCode
          }

      - name: Diagnostic build Storage tests
        run: dotnet build tests/Clipensk.Storage.Tests/Clipensk.Storage.Tests.csproj --configuration Release --no-restore

      - name: Diagnostic coordinator tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & dotnet test tests/Clipensk.Storage.Tests/Clipensk.Storage.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~ProtectedArchiveSplitCoordinatorTests" 2>&1 | Tee-Object -FilePath artifacts/coordinator-test-output.txt
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            exit $testExitCode
          }

      - name: Build
        run: dotnet build Clipensk.slnx --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & dotnet test Clipensk.slnx --configuration Release --no-build 2>&1 | Tee-Object -FilePath artifacts/test-output.txt
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            exit $testExitCode
          }

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.sha }}
          path: |
            artifacts/app-build-output.txt
            artifacts/test-output.txt
            artifacts/coordinator-test-output.txt
          if-no-files-found: warn
          retention-days: 7
