name: Build

on:
  push:
    branches: [ main, feat/policy-maintenance-archive-external-phase ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify x64-only implementation scope
        shell: pwsh
        run: |
          $patterns = 'arm64|windows-11-arm|VC-WIN64-ARM|amd64_arm64|aa64'
          $implementationFiles = & git ls-files -- `
            src tests tools eng `
            .github/workflows/sqlcipher-native.yml `
            Directory.Build.props Directory.Packages.props Clipensk.slnx
          if ($LASTEXITCODE -ne 0) {
            throw "git ls-files failed with exit code $LASTEXITCODE."
          }

          $matches = @(
            foreach ($file in $implementationFiles) {
              Select-String -LiteralPath $file -Pattern $patterns -CaseSensitive:$false
            }
          )

          if ($matches.Count -gt 0) {
            $matches | ForEach-Object { Write-Host $_ }
            throw 'ARM64 implementation marker found. Clipensk supports Windows x64 only.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Clipensk.slnx

      - name: Build
        run: dotnet build Clipensk.slnx --configuration Release --no-restore

      - name: Test with focused failure diagnostics
        shell: pwsh
        run: |
          & dotnet test Clipensk.slnx --configuration Release --no-build --logger "trx;LogFileName=full.trx"
          $testExit = $LASTEXITCODE

          Get-ChildItem -Path . -Recurse -Filter full.trx | ForEach-Object {
            [xml]$trx = Get-Content -Raw $_.FullName
            foreach ($result in $trx.SelectNodes("//*[local-name()='UnitTestResult' and @outcome='Failed']")) {
              Write-Host "FAILED: $($result.GetAttribute('testName'))"
              $message = $result.SelectSingleNode("./*[local-name()='Output']/*[local-name()='ErrorInfo']/*[local-name()='Message']")
              $stack = $result.SelectSingleNode("./*[local-name()='Output']/*[local-name()='ErrorInfo']/*[local-name()='StackTrace']")
              if ($null -ne $message) { Write-Host "MESSAGE: $($message.InnerText)" }
              if ($null -ne $stack) { Write-Host "STACK: $($stack.InnerText)" }
            }
          }

          exit $testExit
