name: Build

on:
  push:
    branches: [ main, feat/policy-maintenance-archive-external-phase ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify x64-only implementation scope
        shell: pwsh
        run: |
          $patterns = 'arm64|windows-11-arm|VC-WIN64-ARM|amd64_arm64|aa64'
          $implementationFiles = & git ls-files -- `
            src tests tools eng `
            .github/workflows/sqlcipher-native.yml `
            Directory.Build.props Directory.Packages.props Clipensk.slnx
          if ($LASTEXITCODE -ne 0) {
            throw "git ls-files failed with exit code $LASTEXITCODE."
          }

          $matches = @(
            foreach ($file in $implementationFiles) {
              Select-String -LiteralPath $file -Pattern $patterns -CaseSensitive:$false
            }
          )

          if ($matches.Count -gt 0) {
            $matches | ForEach-Object { Write-Host $_ }
            throw 'ARM64 implementation marker found. Clipensk supports Windows x64 only.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Clipensk.slnx

      - name: Build
        run: dotnet build Clipensk.slnx --configuration Release --no-restore

      - name: Diagnose Archive - denied external references
        continue-on-error: true
        run: dotnet test Clipensk.slnx --configuration Release --no-build --filter "FullyQualifiedName~ApplyAsync_RemovesDeniedExternalReferencesButPreservesOrdinaryArchivePayloadsAndEventHeaders"

      - name: Diagnose Archive - application override and binary names
        continue-on-error: true
        run: dotnet test Clipensk.slnx --configuration Release --no-build --filter "FullyQualifiedName~ApplyAsync_ApplicationOverrideNullSourceAndBinaryFormatNamesUseExactEffectivePolicy"

      - name: Diagnose Archive - MaxBytes
        continue-on-error: true
        run: dotnet test Clipensk.slnx --configuration Release --no-build --filter "FullyQualifiedName~ApplyAsync_ReducedMaxBytesDoesNotRetroactivelyPurgeAllowedArchiveExternalPayload"

      - name: Diagnose Archive - malformed later archive
        continue-on-error: true
        run: dotnet test Clipensk.slnx --configuration Release --no-build --filter "FullyQualifiedName~ApplyAsync_MalformedLaterArchiveFailsPreflightBeforeAnyArchiveMutation"

      - name: Diagnose Archive - cancellation and resume
        continue-on-error: true
        run: dotnet test Clipensk.slnx --configuration Release --no-build --filter "FullyQualifiedName~ApplyAsync_CancellationAfterFirstArchiveCommitIsResumableAndRetryCompletesRemainingArchive"

      - name: Diagnose Archive - late cancellation
        continue-on-error: true
        run: dotnet test Clipensk.slnx --configuration Release --no-build --filter "FullyQualifiedName~ApplyAsync_LateCancellationAfterMarkerCommitDoesNotDemoteDurableSuccess"

      - name: Diagnose Archive - idempotent retry
        continue-on-error: true
        run: dotnet test Clipensk.slnx --configuration Release --no-build --filter "FullyQualifiedName~ApplyAsync_ExactRetryAfterCompletedArchivePhaseIsIdempotent"

      - name: Diagnose Archive - malformed marker
        continue-on-error: true
        run: dotnet test Clipensk.slnx --configuration Release --no-build --filter "FullyQualifiedName~ApplyAsync_MalformedMarkerStateFailsClosedBeforeArchiveWrites"

      - name: Diagnose Archive - missing marker
        continue-on-error: true
        run: dotnet test Clipensk.slnx --configuration Release --no-build --filter "FullyQualifiedName~ApplyAsync_WithoutGlobalMaintenanceMarkerRejectsBeforeArchiveWrites"

      - name: Diagnose Archive - mutation lease
        continue-on-error: true
        run: dotnet test Clipensk.slnx --configuration Release --no-build --filter "FullyQualifiedName~ApplyAsync_HoldsSharedMutationLeaseAcrossArchiveObservationAndMarkerCommit"

      - name: Test
        run: dotnet test Clipensk.slnx --configuration Release --no-build
