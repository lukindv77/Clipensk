name: Build

on:
  push:
    branches: [ main, feat/policy-maintenance-archive-external-phase ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit deterministic Archive lease test harness
        shell: pwsh
        run: |
          $path = 'tests/Clipensk.Storage.Tests/ProtectedArchiveExternalPolicyMaintenanceServiceTests.cs'
          $old = '        Task<ArchiveExternalPolicyMaintenanceResult> maintenance = Task.Run(() => service.ApplyAsync());'
          $new = @(
            '        Task<ArchiveExternalPolicyMaintenanceResult> maintenance = Task.Factory'
            '            .StartNew('
            '                () => service.ApplyAsync(),'
            '                CancellationToken.None,'
            '                TaskCreationOptions.LongRunning,'
            '                TaskScheduler.Default)'
            '            .Unwrap();'
          ) -join "`n"

          $content = [IO.File]::ReadAllText($path)
          $first = $content.IndexOf($old, [StringComparison]::Ordinal)
          $last = $content.LastIndexOf($old, [StringComparison]::Ordinal)
          if ($first -lt 0 -or $first -ne $last) {
            throw 'Expected exactly one Archive lease Task.Run call to replace.'
          }

          $updated = $content.Replace($old, $new, [StringComparison]::Ordinal)
          [IO.File]::WriteAllText($path, $updated, [Text.UTF8Encoding]::new($false))
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $path
          git diff --cached --check
          git commit -m 'test: isolate blocking Archive lease checkpoint thread'
          git push origin "HEAD:$env:GITHUB_REF_NAME"

      - name: Verify x64-only implementation scope
        shell: pwsh
        run: |
          $patterns = 'arm64|windows-11-arm|VC-WIN64-ARM|amd64_arm64|aa64'
          $implementationFiles = & git ls-files -- `
            src tests tools eng `
            .github/workflows/sqlcipher-native.yml `
            Directory.Build.props Directory.Packages.props Clipensk.slnx
          if ($LASTEXITCODE -ne 0) {
            throw "git ls-files failed with exit code $LASTEXITCODE."
          }

          $matches = @(
            foreach ($file in $implementationFiles) {
              Select-String -LiteralPath $file -Pattern $patterns -CaseSensitive:$false
            }
          )

          if ($matches.Count -gt 0) {
            $matches | ForEach-Object { Write-Host $_ }
            throw 'ARM64 implementation marker found. Clipensk supports Windows x64 only.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Clipensk.slnx --verbosity quiet

      - name: Build
        run: dotnet build Clipensk.slnx --configuration Release --no-restore --verbosity quiet

      - name: Test
        run: dotnet test Clipensk.slnx --configuration Release --no-build