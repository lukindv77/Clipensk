name: Build

on:
  push:
    branches: [ main, feat/current-v7-policy-maintenance ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap Current v7 policy maintenance
        if: github.ref_name == 'feat/current-v7-policy-maintenance'
        shell: pwsh
        run: ./eng/bootstrap-current-v7-policy-maintenance.ps1

      - name: Verify x64-only implementation scope
        shell: pwsh
        run: |
          $patterns = 'arm64|windows-11-arm|VC-WIN64-ARM|amd64_arm64|aa64'
          $implementationFiles = & git ls-files -- `
            src tests tools eng `
            .github/workflows/sqlcipher-native.yml `
            Directory.Build.props Directory.Packages.props Clipensk.slnx
          if ($LASTEXITCODE -ne 0) {
            throw "git ls-files failed with exit code $LASTEXITCODE."
          }

          $matches = @(
            foreach ($file in $implementationFiles) {
              Select-String -LiteralPath $file -Pattern $patterns -CaseSensitive:$false
            }
          )

          if ($matches.Count -gt 0) {
            $matches | ForEach-Object { Write-Host $_ }
            throw 'ARM64 implementation marker found. Clipensk supports Windows x64 only.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Clipensk.slnx

      - name: Build
        run: dotnet build Clipensk.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Clipensk.slnx --configuration Release --no-build

      - name: Commit validated Current v7 implementation
        if: github.ref_name == 'feat/current-v7-policy-maintenance' && success()
        shell: pwsh
        run: |
          git add src tests
          if (-not (git diff --cached --quiet)) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: add Current v7 policy maintenance marker'
            git push origin "HEAD:${{ github.ref_name }}"
          }
