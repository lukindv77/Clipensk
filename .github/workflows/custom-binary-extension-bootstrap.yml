'@

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Verify x64-only implementation scope
        shell: pwsh
        run: |
          $patterns = 'arm64|windows-11-arm|VC-WIN64-ARM|amd64_arm64|aa64'
          $implementationFiles = & git ls-files -- `
            src tests tools eng `
            .github/workflows/sqlcipher-native.yml `
            Directory.Build.props Directory.Packages.props Clipensk.slnx
          if ($LASTEXITCODE -ne 0) { throw "git ls-files failed with exit code $LASTEXITCODE." }
          $matches = @(
            foreach ($file in $implementationFiles) {
              if (Test-Path -LiteralPath $file) {
                Select-String -LiteralPath $file -Pattern $patterns -CaseSensitive:$false
              }
            }
          )
          if ($matches.Count -gt 0) {
            $matches | ForEach-Object { Write-Host $_ }
            throw 'ARM64 implementation marker found. Clipensk supports Windows x64 only.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Clipensk.slnx

      - name: Build
        run: dotnet build Clipensk.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Clipensk.slnx --configuration Release --no-build

      - name: Commit validated implementation
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'feat: persist custom binary file extensions'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed.' }
          git push origin HEAD:ci/custom-binary-extension-bootstrap
          if ($LASTEXITCODE -ne 0) { throw 'git push failed.' }
