name: Custom binary extension bootstrap

on:
  push:
    branches: [ ci/custom-binary-extension-bootstrap ]

permissions:
  contents: write

concurrency:
  group: custom-binary-extension-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply implementation patch
        shell: pwsh
        run: |
          $patchPath = 'eng/custom-binary-extension-config.patch'
          $lines = @(Get-Content -LiteralPath $patchPath)
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^@@ -(?<oldStart>\d+)(?:,(?<oldCount>\d+))? \+(?<newStart>\d+)(?:,(?<newCount>\d+))? @@(?<suffix>.*)$') {
              $oldStart = [int]$Matches.oldStart
              $newStart = [int]$Matches.newStart
              $suffix = $Matches.suffix
              $oldCount = 0
              $newCount = 0
              $j = $i + 1
              while ($j -lt $lines.Count -and
                     -not $lines[$j].StartsWith('@@ ') -and
                     -not $lines[$j].StartsWith('diff --git ')) {
                if ($lines[$j].StartsWith(' ') -or $lines[$j].StartsWith('-')) { $oldCount++ }
                if ($lines[$j].StartsWith(' ') -or $lines[$j].StartsWith('+')) { $newCount++ }
                $j++
              }
              $lines[$i] = "@@ -$oldStart,$oldCount +$newStart,$newCount @@$suffix"
            }
          }
          Set-Content -LiteralPath $patchPath -Value $lines -Encoding utf8NoBOM
          git apply --check $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'git apply --check failed.' }
          git apply $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'git apply failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Verify x64-only implementation scope
        shell: pwsh
        run: |
          $patterns = 'arm64|windows-11-arm|VC-WIN64-ARM|amd64_arm64|aa64'
          $implementationFiles = & git ls-files -- `
            src tests tools eng `
            .github/workflows/sqlcipher-native.yml `
            Directory.Build.props Directory.Packages.props Clipensk.slnx
          if ($LASTEXITCODE -ne 0) { throw "git ls-files failed with exit code $LASTEXITCODE." }
          $matches = @(
            foreach ($file in $implementationFiles) {
              if (Test-Path -LiteralPath $file) {
                Select-String -LiteralPath $file -Pattern $patterns -CaseSensitive:$false
              }
            }
          )
          if ($matches.Count -gt 0) {
            $matches | ForEach-Object { Write-Host $_ }
            throw 'ARM64 implementation marker found. Clipensk supports Windows x64 only.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Clipensk.slnx

      - name: Build
        run: dotnet build Clipensk.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Clipensk.slnx --configuration Release --no-build

      - name: Commit validated implementation
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'feat: persist custom binary file extensions'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed.' }
          git push origin HEAD:ci/custom-binary-extension-bootstrap
          if ($LASTEXITCODE -ne 0) { throw 'git push failed.' }
